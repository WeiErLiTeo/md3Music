name: Sync Upstream & Build YT3 Release

# 功能说明：
# 1. sync-upstream（每天定时 + 手动触发）：
#    - 检测最上游仓库 zzyoxml/md3Music (rust-local-force) 是否有更新
#    - 将 yt3 的定制改动自动三方合并到上游最新代码上（用 .md3/base/ 保存基准文件，防止上游 force-push 丢失基准提交）
#    - 若无冲突则直接推送到本仓库 yt3 分支；仅当上游版本号更新（本仓库尚未发布对应版本的 Release）时才触发 build-yt3-release 打包发版
#
# 2. build-yt3-release（当检测到新版本尚未发版，或手动选择 build_release_now 时触发）：
#    - 版本号与 Release 标签名（vX.Y.Z）跟随上游，自动发布到本仓库的 GitHub Releases 并保留所有历史版本
on:
  schedule:
    - cron: '30 1 * * *'
  push:
    branches:
      - yt3
  workflow_dispatch:
    inputs:
      action:
        description: '执行模式'
        required: true
        type: choice
        options:
          - sync_and_check
          - build_release_now
        default: 'sync_and_check'

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

concurrency:
  group: yt3-sync-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync-upstream:
    name: Check & Sync Upstream (zzyoxml/md3Music)
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.action == 'sync_and_check') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - name: Checkout yt3
        uses: actions/checkout@v4
        with:
          ref: yt3
          fetch-depth: 0

      - name: Fetch upstream and compare
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/zzyoxml/md3Music.git
          git fetch upstream rust-local-force --no-tags
          git fetch origin rust-local-force yt3 --no-tags

          UPSTREAM_SHA="$(git rev-parse upstream/rust-local-force)"
          UPSTREAM_SHORT="${UPSTREAM_SHA:0:8}"
          UPSTREAM_VER="$(git show upstream/rust-local-force:pubspec.yaml | grep -m1 '^version:' | sed 's/^version:[[:space:]]*//' | tr -d '\r')"
          VER_NAME="${UPSTREAM_VER%+*}"
          VER_CODE="${UPSTREAM_VER#*+}"
          if [[ "$VER_CODE" == "$UPSTREAM_VER" || -z "$VER_CODE" ]]; then
            VER_CODE=1
          fi
          RELEASE_TAG="v${VER_NAME}"

          echo "上游最新提交: ${UPSTREAM_SHA} (版本: ${UPSTREAM_VER}, Release Tag: ${RELEASE_TAG})"

          # 1. 保持本仓库 rust-local-force 分支与上游 100% 同步（不改 workflow 权限问题时尽力同步）
          git push origin "refs/remotes/upstream/rust-local-force:refs/heads/rust-local-force" --force || \
            echo "::warning::rust-local-force 包含上游 workflow 变更，跳过直接强制推送分支，继续同步 yt3"

          # 2. 读取 .md3/upstream-base-sha 判断当前 yt3 是否已同步到该上游提交
          BASE_SHA=""
          if [[ -f ".md3/upstream-base-sha" ]]; then
            BASE_SHA="$(tr -d '[:space:]' < .md3/upstream-base-sha)"
          fi

          if [[ "$BASE_SHA" == "$UPSTREAM_SHA" ]]; then
            if ! gh release view "$RELEASE_TAG" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
              echo "yt3 代码已是最新 (${UPSTREAM_VER} @ ${UPSTREAM_SHORT})，但尚未发布 ${RELEASE_TAG} Release，触发打包发布。"
              echo "should_release=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "yt3 已经包含上游最新代码且已发布 ${RELEASE_TAG} (${UPSTREAM_VER} @ ${UPSTREAM_SHORT})，无需同步。"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "检测到上游新提交：${BASE_SHA:0:8} -> ${UPSTREAM_SHORT} (${UPSTREAM_VER})"
          SYNC_BRANCH="sync/upstream-${UPSTREAM_SHORT}"

          # 3. 对最小挂载文件做三方合并
          HOOK_FILES=(
            "README.md"
            "lib/providers/theme_provider.dart"
            "lib/modules/player/full_player_route.dart"
            "lib/modules/player/player_drag_overlay.dart"
            "lib/modules/player/car_mode_panel.dart"
            "lib/widgets/settings_preview/lyric_effect_preview.dart"
            "lib/modules/settings/settings_page.dart"
            "test/modules/player/full_player_style_sync_test.dart"
          )

          # 以 origin/yt3 为父提交创建同步工作分支
          git checkout -B "${SYNC_BRANCH}" origin/yt3

          # 先把整个工作区替换成 upstream/rust-local-force 的最新快照
          git rm -rf . > /dev/null
          git checkout upstream/rust-local-force -- .

          # 保持 .github/workflows 目录与 origin/yt3 完全一致（GitHub 禁止 GITHUB_TOKEN 修改任何 .github/workflows 文件）
          git rm -rf .github/workflows > /dev/null 2>&1 || true
          git checkout origin/yt3 -- .github/workflows

          # 恢复 YT 纯新增文件并更新上游基准 SHA 标记
          git checkout origin/yt3 -- \
            lib/modules/player/full_player_yt.dart \
            lib/modules/player/yt/
          mkdir -p .md3/base
          printf '%s\n' "${UPSTREAM_SHA}" > .md3/upstream-base-sha

          # 对挂载文件做三方合并 (current=yt3, base=.md3/base/ 快照, other=最新上游 UPSTREAM_SHA)
          CONFLICT_FILES=()
          for hf in "${HOOK_FILES[@]}"; do
            TMP_YT="$(mktemp)"
            TMP_BASE="$(mktemp)"
            TMP_UP="$(mktemp)"
            git show "origin/yt3:${hf}" > "$TMP_YT"
            git show "upstream/rust-local-force:${hf}" > "$TMP_UP"

            if git cat-file -e "origin/yt3:.md3/base/${hf}" 2>/dev/null; then
              git show "origin/yt3:.md3/base/${hf}" > "$TMP_BASE"
              if git merge-file -L "yt3" -L "base" -L "upstream" "$TMP_YT" "$TMP_BASE" "$TMP_UP"; then
                cp "$TMP_YT" "$hf"
              else
                cp "$TMP_YT" "$hf"
                CONFLICT_FILES+=("$hf")
              fi
            elif [[ -n "$BASE_SHA" ]] && git cat-file -e "${BASE_SHA}:${hf}" 2>/dev/null; then
              git show "${BASE_SHA}:${hf}" > "$TMP_BASE"
              if git merge-file -L "yt3" -L "base" -L "upstream" "$TMP_YT" "$TMP_BASE" "$TMP_UP"; then
                cp "$TMP_YT" "$hf"
              else
                cp "$TMP_YT" "$hf"
                CONFLICT_FILES+=("$hf")
              fi
            else
              # 若上游 force-push 抹掉了旧 BASE_SHA 且尚未生成 .md3/base 快照，用最近公共基准 + union 合并
              FALLBACK_BASE="$(git rev-parse origin/rust-local-force)"
              git show "${FALLBACK_BASE}:${hf}" > "$TMP_BASE"
              git merge-file --union -L "yt3" -L "base" -L "upstream" "$TMP_YT" "$TMP_BASE" "$TMP_UP"
              cp "$TMP_YT" "$hf"
            fi

            # 将本次上游原版文件存入 .md3/base/，供下次合并作精确基准（不受上游 force-push 影响）
            mkdir -p ".md3/base/$(dirname "$hf")"
            cp "$TMP_UP" ".md3/base/${hf}"

            rm -f "$TMP_YT" "$TMP_BASE" "$TMP_UP"
          done

          if (( ${#CONFLICT_FILES[@]} > 0 )); then
            echo "::error::以下文件在三方合并时发生冲突: ${CONFLICT_FILES[*]}"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          git add -A
          if git diff --cached --quiet; then
            echo "合并后无文件变更。"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "chore(sync): 同步上游 ${UPSTREAM_VER} (${UPSTREAM_SHORT}) [upstream-base:${UPSTREAM_SHORT}]"
          git push origin "${SYNC_BRANCH}:refs/heads/yt3"
          echo "已自动合并并推送至 yt3 分支: ${UPSTREAM_VER} (${UPSTREAM_SHORT})"

          # 只有当本仓库尚未发布当前版本号 (${RELEASE_TAG}) 的 Release 时，才触发 Release 打包发布；
          # 如果当前版本号已经发布过 Release，则仅同步代码，不覆盖已有 Release。
          if gh release view "$RELEASE_TAG" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "当前版本 ${RELEASE_TAG} 已存在 Release，本次仅同步日常代码，不重复发布或覆盖 Release。"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "检测到新版本 ${RELEASE_TAG} 尚未发布 Release，触发编译并发布新版本 Release。"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  build-yt3-release:
    name: Build & Publish YT3 64-bit Release APK
    needs: [sync-upstream]
    if: >-
      always() && (
        (needs.sync-upstream.result == 'success' && needs.sync-upstream.outputs.should_release == 'true') ||
        (github.event_name == 'push' && github.ref == 'refs/heads/yt3' && contains(github.event.head_commit.message, '[release]')) ||
        (github.event_name == 'workflow_dispatch' && inputs.action == 'build_release_now')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout yt3
        uses: actions/checkout@v4
        with:
          ref: yt3
          fetch-depth: 0

      - name: Read version from pubspec.yaml (keep synced with upstream)
        id: bump
        run: |
          set -euo pipefail
          RAW_VER="$(grep -m1 '^version:' pubspec.yaml | sed 's/^version:[[:space:]]*//' | tr -d '\r')"
          VER_NAME="${RAW_VER%+*}"
          VER_CODE="${RAW_VER#*+}"
          if [[ "$VER_CODE" == "$RAW_VER" || -z "$VER_CODE" ]]; then
            VER_CODE=1
          fi
          FULL_VERSION="${VER_NAME}+${VER_CODE}"
          RELEASE_TAG="v${VER_NAME}"

          echo "当前版本: ${VER_NAME} (Tag: ${RELEASE_TAG})"
          echo "version=${VER_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VER_CODE}" >> "$GITHUB_OUTPUT"
          echo "full_version=${FULL_VERSION}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "cmdline-tools;latest" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Download official release.keystore & configure signing
        run: |
          set -euo pipefail
          # 优先从本仓库或上游下载 release.keystore，若 GitHub CDN 504 则使用内置同源钥匙兜底
          if ! curl -fL --retry 2 --connect-timeout 10 -o android/app/release.keystore \
              "https://github.com/${GITHUB_REPOSITORY}/releases/download/keystore/release.keystore" 2>/dev/null; then
            if ! curl -fL --retry 2 --connect-timeout 10 -o android/app/release.keystore \
                "https://github.com/zzyoxml/md3Music/releases/download/keystore/release.keystore" 2>/dev/null; then
              printf "%s" "" | base64 -d > android/app/release.keystore
            fi
          fi

          cat > android/keystore.properties <<EOF
          storePassword=android
          keyPassword=android
          keyAlias=androiddebugkey
          storeFile=release.keystore
          EOF

          ls -lh android/app/release.keystore

      - name: Flutter pub get & Build 64-bit Release APK (R8 + ShrinkResources)
        run: |
          set -euo pipefail
          flutter pub get
          # 只编译 64 位 (android-arm64) 标准版 Release 包（build.gradle.kts 已开启 isMinifyEnabled=true 与 isShrinkResources=true）
          flutter build apk --release --flavor lite --split-per-abi \
            --target-platform android-arm64 \
            --android-project-arg=md3ApplicationId=com.md3music.md3music

      - name: Rename & Verify 64-bit Release APK signature
        id: apk
        run: |
          set -euo pipefail
          apk_dir="build/app/outputs/flutter-apk"
          ver="${{ steps.bump.outputs.version }}"
          src="${apk_dir}/app-arm64-v8a-lite-release.apk"
          dst="${apk_dir}/MD3Music-${ver}-standard-arm64-v8a.apk"
          mv "$src" "$dst"

          # 校验 ABI 仅含 arm64-v8a 且签名 SHA-256 与上游正式版一致
          aapt2="${ANDROID_HOME}/build-tools/36.0.0/aapt2"
          apksigner="${ANDROID_HOME}/build-tools/36.0.0/apksigner"
          test "$("$aapt2" dump badging "$dst" | sed -n "s/^native-code: //p")" = "'arm64-v8a'"

          sign_fp="$("$apksigner" verify --print-certs "$dst" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr -d ' :' | tr 'A-F' 'a-f')"
          echo "APK SHA-256: ${sign_fp}"
          test "$sign_fp" = "84ba3586aea04c54bb329cfe42eff8a42751d4135667cf633597c268e95a1b33"

          echo "apk_path=${dst}" >> "$GITHUB_OUTPUT"
          echo "apk_name=$(basename "$dst")" >> "$GITHUB_OUTPUT"

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.apk_name }}
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.bump.outputs.release_tag }}"
          VER="${{ steps.bump.outputs.version }}"
          APK="${{ steps.apk.outputs.apk_path }}"

          if gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.action }}" == "build_release_now" ]]; then
              echo "手动指定 build_release_now，更新已有 Release ${TAG}..."
              gh release upload "$TAG" "$APK" --repo "${GITHUB_REPOSITORY}" --clobber
              exit 0
            fi
            echo "Release ${TAG} 已存在，保留现有版本不覆盖。"
            exit 0
          fi

          git tag -f "$TAG"
          git push origin "refs/tags/${TAG}" --force

          NOTES_FILE="$(mktemp)"
          cat > "$NOTES_FILE" <<EOF
          ## MD3Music v${VER}

          ### 本分支更新内容 (yt3)
          - 新增 YouTube Music 播放页样式（可在「设置 → 播放页样式」中切换）
          - 播放页顶栏支持「音频 / 视频」切换，有 MV 的歌曲可直接在播放页内播放视频，视频模式下背景跟随视频画面模糊
          - 中间区域为正方形封面与左对齐歌曲信息，下方为横向滚动的胶囊按钮栏（喜欢、评论、添加到歌单、音质、倍速、睡眠定时等）
          - 底部固定「接下来播放」「歌词」「评论」三个抽屉入口，支持点击展开与上下滑动收起
          - 选中 YouTube Music 样式时，设置页中仅对 MD3 / Apple Music 生效的「顶栏与横屏布局」「音乐频谱」选项自动变灰禁用
          EOF

          gh release create "$TAG" "$APK" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "MD3Music v${VER}" \
            --notes-file "$NOTES_FILE"
          rm -f "$NOTES_FILE"
