name: Generate Debug Keystore

# 只需要手动运行一次：在云端生成一把固定的「调试钥匙」，提交到仓库的 android/md3-debug.keystore。
# 之后 Debug Build & Test 每次构建都用这把钥匙签名，手机上就能直接覆盖安装。
#
# 注意：
#   1. 请在默认分支（通常是 main）上运行，这样所有 PR 构建都能拿到同一把钥匙。
#   2. 钥匙文件已存在时不会覆盖，因为一旦换钥匙，手机上又要卸载重装。
#   3. 这把钥匙公开在仓库里，只用来签测试包，不要用它签正式发布的包。
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-debug-keystore
  cancel-in-progress: false

jobs:
  generate:
    name: Generate fixed debug keystore
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash

    steps:
      - name: Check branch
        env:
          CURRENT_BRANCH: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [[ "${CURRENT_BRANCH}" != "${DEFAULT_BRANCH}" ]]; then
            echo "::error title=分支不对::请在默认分支（${DEFAULT_BRANCH}）上运行，当前是 ${CURRENT_BRANCH}。在别的分支生成会得到另一把钥匙。"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate keystore
        id: gen
        run: |
          set -euo pipefail
          ks="android/md3-debug.keystore"

          if [[ -f "$ks" ]]; then
            echo "::error title=钥匙已存在::$ks 已经存在，为避免换钥匙导致手机上又要卸载重装，不会覆盖。如确实要换，请先手动删除该文件。"
            exit 1
          fi

          mkdir -p android
          keytool -genkeypair \
            -keystore "$ks" \
            -storetype PKCS12 \
            -storepass android \
            -keypass android \
            -alias md3debug \
            -keyalg RSA \
            -keysize 2048 \
            -validity 36500 \
            -dname "CN=MD3 Debug, OU=Debug, O=MD3 Music, C=CN"

          [[ -s "$ks" ]] || { echo "::error::keytool 没有生成钥匙文件"; exit 1; }

          info="$(keytool -list -v -keystore "$ks" -storepass android -alias md3debug -J-Duser.language=en)"
          fp="$(printf '%s\n' "$info" | sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' | head -n 1)"
          [[ -n "$fp" ]] || { echo "::error::读取不到钥匙的 SHA-256 指纹"; exit 1; }
          echo "FINGERPRINT=$fp" >> "$GITHUB_ENV"

      - name: Commit keystore to repository
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Flutter 默认的 android/.gitignore 会忽略 *.keystore，所以必须 -f
          git add -f android/md3-debug.keystore
          git commit -m "chore: add fixed debug keystore for test builds"
          git push

      - name: Summary
        run: |
          {
            echo "## 固定调试钥匙已生成并提交"
            echo
            echo "- 文件：\`android/md3-debug.keystore\`"
            echo "- 别名：\`md3debug\`，密码：\`android\`"
            echo "- SHA-256 指纹：\`${FINGERPRINT}\`"
            echo
            echo "下一步：更新 Debug Build & Test 工作流；第一次安装新构建的包前，手机上要卸载旧版一次。"
          } >> "$GITHUB_STEP_SUMMARY"
