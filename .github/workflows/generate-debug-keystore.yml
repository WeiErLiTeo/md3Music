name: Generate Debug Keystore

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-keystore:
    name: Generate and Commit Debug Keystore
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate debug keystore if missing
        run: |
          set -euo pipefail
          mkdir -p android
          ks="android/md3-debug.keystore"
          if [[ ! -f "$ks" ]]; then
            keytool -genkey -v -keystore "$ks" -storepass android -alias md3debug -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=MD3Music Debug, OU=MD3Music, O=MD3Music, L=City, ST=State, C=US"
            echo "Keystore generated successfully at $ks"
          else
            echo "Keystore already exists at $ks"
          fi

      - name: Commit and push keystore
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/md3-debug.keystore android/.gitignore
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "build: generate fixed debug keystore"
            git push
          fi
